<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1450" role="img" aria-labelledby="evolution-mobile-title evolution-mobile-desc">
<title id="evolution-mobile-title">Corporate evolution — mobile</title>
<desc id="evolution-mobile-desc">Verified outcomes update contextual fitness; Pareto selection preserves champions, challengers and negative results.</desc>
<rect width="900" height="1450" rx="38" fill="#050812"/>
<text x="70" y="92" font-family="Inter,system-ui" font-size="24" font-weight="800" letter-spacing="7" fill="#D8B86A">CORPORATE EVOLUTION</text><text x="70" y="150" font-family="Georgia,serif" font-size="43" fill="#F7F1E2">Outcomes evolve how the company works.</text>
<g font-family="Inter,system-ui" text-anchor="middle"><g transform="translate(450 280)"><path d="M-230 -62 H230 L255 0 L230 62 H-230 L-255 0 Z" fill="#0E1627" stroke="#AEB5C2" stroke-width="4"/><text y="-5" font-size="29" font-weight="800" fill="#AEB5C2">CANDIDATE GENE</text><text y="31" font-size="18" fill="#AEB5C2">strategy · process · skill</text></g><path d="M450 342 V398" stroke="#25304A" stroke-width="4"/><g transform="translate(450 460)"><path d="M-230 -62 H230 L255 0 L230 62 H-230 L-255 0 Z" fill="#0E1627" stroke="#EA5965" stroke-width="4"/><text y="-5" font-size="29" font-weight="800" fill="#EA5965">COMPETE / PILOT</text><text y="31" font-size="18" fill="#AEB5C2">parallel variants · reversible test</text></g><path d="M450 522 V578" stroke="#25304A" stroke-width="4"/><g transform="translate(450 640)"><path d="M-230 -62 H230 L255 0 L230 62 H-230 L-255 0 Z" fill="#0E1627" stroke="#54D39E" stroke-width="4"/><text y="-5" font-size="29" font-weight="800" fill="#54D39E">VERIFIED OUTCOME</text><text y="31" font-size="18" fill="#AEB5C2">business evidence, not opinion</text></g><path d="M450 702 V758" stroke="#25304A" stroke-width="4"/><g transform="translate(450 820)"><path d="M-230 -62 H230 L255 0 L230 62 H-230 L-255 0 Z" fill="#0E1627" stroke="#7187FA" stroke-width="4"/><text y="-5" font-size="29" font-weight="800" fill="#7187FA">FITNESS SNAPSHOT</text><text y="31" font-size="18" fill="#AEB5C2">quality · cost · risk · latency · reliability</text></g><path d="M450 882 V938" stroke="#25304A" stroke-width="4"/><g transform="translate(450 1000)"><path d="M-230 -62 H230 L255 0 L230 62 H-230 L-255 0 Z" fill="#0E1627" stroke="#D8B86A" stroke-width="4"/><text y="-5" font-size="29" font-weight="800" fill="#D8B86A">PARETO SELECTION</text><text y="31" font-size="18" fill="#AEB5C2">no single profit-only score</text></g>
<path d="M450 1062 V1120" stroke="#D8B86A" stroke-width="4"/><path d="M450 1120 C300 1150 250 1190 220 1240 M450 1120 C450 1170 450 1190 450 1240 M450 1120 C600 1150 650 1190 680 1240" fill="none" stroke="#D8B86A" stroke-width="4"/>
<g transform="translate(220 1305)"><rect x="-95" y="-48" width="190" height="96" rx="18" fill="#0E1627" stroke="#54D39E" stroke-width="3"/><text y="10" font-size="23" font-weight="800" fill="#54D39E">CHAMPION</text></g><g transform="translate(450 1305)"><rect x="-95" y="-48" width="190" height="96" rx="18" fill="#0E1627" stroke="#7187FA" stroke-width="3"/><text y="10" font-size="23" font-weight="800" fill="#7187FA">CHALLENGER</text></g><g transform="translate(680 1305)"><rect x="-95" y="-48" width="190" height="96" rx="18" fill="#0E1627" stroke="#A784EF" stroke-width="3"/><text y="10" font-size="23" font-weight="800" fill="#A784EF">SILENT</text></g>
<text x="450" y="1400" font-size="19" fill="#AEB5C2">negative results stay remembered; exploration never goes to zero</text></g></svg>