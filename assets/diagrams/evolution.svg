<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 700" role="img" aria-labelledby="evolution-title evolution-desc">
<title id="evolution-title">Corporate Evolution</title>
<desc id="evolution-desc">Verified outcomes update multi-objective fitness; Pareto selection promotes champion and challenger corporate genes while preserving silent negative results.</desc>
<rect width="1320" height="700" rx="36" fill="#070B14"/><rect x="2" y="2" width="1316" height="696" rx="34" fill="none" stroke="#D6B56B" stroke-opacity="0.35"/>
<text x="72" y="78" font-family="Inter,system-ui,sans-serif" font-size="20" font-weight="800" letter-spacing="6" fill="#D6B56B">CORPORATE EVOLUTION</text>
<text x="72" y="124" font-family="Georgia,serif" font-size="34" fill="#F6F0DF">The model stays. The company around it evolves.</text>
<g fill="none" stroke="#B9B2A3" stroke-opacity="0.35" stroke-width="2"><path d="M235 360 C300 360 330 250 365 250"/><path d="M235 360 C300 360 330 470 365 470"/><path d="M455 250 H620"/><path d="M455 470 H620"/><path d="M765 470 H900"/></g>
<g transform="translate(190 360)"><path d="M0 -54 L46 -28 L54 18 L22 54 H-22 L-54 18 L-46 -28 Z" fill="#0D1321" stroke="#B9B2A3" stroke-width="2"/><circle r="23" fill="#B9B2A3" fill-opacity="0.13"/><text x="0" y="5" text-anchor="middle" font-family="system-ui" font-size="14" font-weight="800" fill="#B9B2A3">v1</text></g><g transform="translate(410 250)"><path d="M0 -54 L46 -28 L54 18 L22 54 H-22 L-54 18 L-46 -28 Z" fill="#0D1321" stroke="#E7525B" stroke-width="2"/><circle r="23" fill="#E7525B" fill-opacity="0.13"/><text x="0" y="5" text-anchor="middle" font-family="system-ui" font-size="14" font-weight="800" fill="#E7525B">v2A</text></g><g transform="translate(410 470)"><path d="M0 -54 L46 -28 L54 18 L22 54 H-22 L-54 18 L-46 -28 Z" fill="#0D1321" stroke="#6E82F5" stroke-width="2"/><circle r="23" fill="#6E82F5" fill-opacity="0.13"/><text x="0" y="5" text-anchor="middle" font-family="system-ui" font-size="14" font-weight="800" fill="#6E82F5">v2B</text></g><g transform="translate(675 250)"><path d="M0 -54 L46 -28 L54 18 L22 54 H-22 L-54 18 L-46 -28 Z" fill="#0D1321" stroke="#D6B56B" stroke-width="4"/><circle r="23" fill="#D6B56B" fill-opacity="0.13"/><text x="0" y="5" text-anchor="middle" font-family="system-ui" font-size="10" font-weight="800" fill="#D6B56B">CHAMPION</text></g><g transform="translate(675 470)"><path d="M0 -54 L46 -28 L54 18 L22 54 H-22 L-54 18 L-46 -28 Z" fill="#0D1321" stroke="#E56EB1" stroke-width="2"/><circle r="23" fill="#E56EB1" fill-opacity="0.13"/><text x="0" y="5" text-anchor="middle" font-family="system-ui" font-size="10" font-weight="800" fill="#E56EB1">CHALLENGER</text></g><g transform="translate(945 470)"><path d="M0 -54 L46 -28 L54 18 L22 54 H-22 L-54 18 L-46 -28 Z" fill="#0D1321" stroke="#687183" stroke-width="2"/><circle r="23" fill="#687183" fill-opacity="0.13"/><text x="0" y="5" text-anchor="middle" font-family="system-ui" font-size="10" font-weight="800" fill="#687183">SILENT</text></g>
<g transform="translate(1120 258)"><path d="M-90 -76 H90 L128 -38 V38 L90 76 H-90 L-128 38 V-38 Z" fill="#0D1321" stroke="#4ED09B" stroke-width="2"/><text x="0" y="-22" text-anchor="middle" font-family="system-ui" font-size="17" fill="#4ED09B">VERIFIED OUTCOME</text><text x="0" y="8" text-anchor="middle" font-family="system-ui" font-size="14" fill="#F6F0DF">quality · cost · risk</text><text x="0" y="34" text-anchor="middle" font-family="system-ui" font-size="14" fill="#F6F0DF">latency · reliability</text></g>
<path d="M1050 334 C980 365 880 350 760 280" fill="none" stroke="#4ED09B" stroke-width="3" stroke-dasharray="8 10"/>
<text x="1132" y="470" text-anchor="middle" font-family="system-ui" font-size="16" fill="#D6B56B">PARETO FRONT</text><path d="M1015 488 H1248" stroke="#D6B56B" stroke-opacity="0.45"/>
<text x="1132" y="524" text-anchor="middle" font-family="system-ui" font-size="14" fill="#B9B2A3">no single “profit score”</text>
<text x="660" y="620" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="17" fill="#B9B2A3">Negative results survive as evidence. Silent is not forgotten.</text>
</svg>