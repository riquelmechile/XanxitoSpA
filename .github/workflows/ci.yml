name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: xspa
          POSTGRES_DB: xspa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d xspa_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          version: 10.33.0
      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Visual delivery validation
        run: pnpm run visuals:check
      - name: Skill Registry validation
        run: pnpm run skills:check
      - name: Typecheck
        run: pnpm run typecheck
      - name: Unit and integration tests
        run: pnpm run test
      - name: Company Gym
        run: pnpm run gym
      - name: Build
        run: pnpm run build
      - name: MCP Streamable HTTP smoke
        run: pnpm run mcp:smoke
      - name: XanxitoSpA app MCP smoke
        run: pnpm run mcp:app:smoke
      - name: XanxitoSpA app OAuth smoke
        run: pnpm run mcp:app:oauth:smoke
      - name: PostgreSQL 18 smoke
        env:
          XSPA_TEST_DATABASE_URL: postgresql://postgres:xspa@127.0.0.1:5432/xspa_test
        run: pnpm run pg:smoke
